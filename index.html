<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/index.css" />
    <title>Lista de Compras</title>
  </head>
  <body>
    <header>
      <div>
        <div class="logo">
          <img src="assets/Lista de compras/Vector.png" alt="Logo" />
          <span>quicklist</span>
        </div>
        <a href="#"><- Voltar</a>
      </div>
    </header>
    <main>
      <div>
        <h1>Compras da semana</h1>
        <form>
          <input type="text" placeholder="Adicione um novo item" />
          <button type="submit">Adicionar item</button>
        </form>
        <ul class="list">
          <li class="list-item">
            <label>
                <div class="input-checkbox">
                    <input type="checkbox" />
                    <img src="assets/icons/check.png" alt="">
                </div>
                    <span>Pão de forma</span>
                </label>
                <button class="btn-remover">
                    <img src="assets/icons/lixeira.png" alt="Remover item" />
                </button>
            </li>
             <li class="list-item">
            <label>
                <div class="input-checkbox">
                    <input type="checkbox" />
                    <img src="assets/icons/check.png" alt="">
                </div>
                    <span>Café preto</span>
                </label>
                <button class="btn-remover">
                    <img src="assets/icons/lixeira.png" alt="Remover item" />
                </button>
            </li>
             <li class="list-item">
            <label>
                <div class="input-checkbox">
                    <input type="checkbox" />
                    <img src="assets/icons/check.png" alt="">
                </div>
                    <span>Suco de laranja</span>
                </label>
                <button class="btn-remover">
                    <img src="assets/icons/lixeira.png" alt="Remover item" />
                </button>
            </li>
             <li class="list-item">
            <label>
                <div class="input-checkbox">
                    <input type="checkbox" />
                    <img src="assets/icons/check.png" alt="">
                </div>
                    <span>Biscoito</span>
                </label>
                <button class="btn-remover">
                    <img src="assets/icons/lixeira.png" alt="Remover item" />
                </button>
            </li>
          
        </ul>
      </div>
    </main>

     <div class="alerts">
         <div class="alert">
        <div class="alert-content">
          <img src="assets/icons/warning.png" alt="" />
          <span>O item foi removido da lista</span>
        </div>

        <button class="alert-close" aria-label="Fechar">
          <img src="assets/icons/delete.png" alt="" />
        </button>
      </div>
     </div>
  
    <script src="script.js"></script>
  </body>
</html>
