<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">
    <title>Lista de Compras</title>
</head>
<body>
    <header>
        <div class="desktop-only">
            <img src="assets/Lista de compras/Vector.png" alt="Logo">
            <span>quicklist</span>
        </div>
        <div class="icons">
            <a href="#"><- Voltar</a>
        </div>
    </header>
    <main>
    <h1>Compras da semana</h1>
   <form>
    <div class="bnt-submit">
        <input type="text" placeholder="Adicione um novo item">
        <button type="submit"> Adicionar item
        </button>
    </div>
    <div>
        <ul class="list">
    <li>
        <label>
            <input type="checkbox">
            <span>Pão de forma</span>
        </label>
        <button class="btn-remover">
            <img src="assets/icons/lixeira.png" alt="Remover item">
        </button>
    </li>
     <li>
        <label>
            <input type="checkbox">
            <span>Café preto</span>
        </label>
        <button class="btn-remover">
            <img src="assets/icons/lixeira.png" alt="Remover item">
        </button>
    </li>
     <li>
        <label>
            <input type="checkbox">
            <span>Suco de laranja</span>
        </label>
        <button class="btn-remover">
            <img src="assets/icons/lixeira.png" alt="Remover item">
        </button>
    </li>
     <li>
        <label>
            <input type="checkbox">
            <span>Bolacha</span>
        </label>
        <button class="btn-remover">
            <img src="assets/icons/lixeira.png" alt="Remover item">
        </button>
    </li>
</ul>
    </div>
</form>
</main>

<footer>
    <div class="alert">
    <div class="alert-content">
        <img src="assets/icons/warning.png" alt="">
        <span>O item foi removido da lista</span>
    </div>

    <button class="alert-close" aria-label="Fechar">
        <img src="assets/icons/delete.png" alt="">
    </button>
</div>
</footer>
     <script src="script.js"></script>
   
    </body>
</html>
